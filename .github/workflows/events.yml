name: Events

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script writes nothing when a source fails: the run fails and the
      # previous events.json stays published.
      - name: Build events.json
        run: python build_events.py

      - name: Commit if changed
        run: |
          git add events.json
          if git diff --cached --quiet; then
            echo "events.json did not change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update events"
          git push
